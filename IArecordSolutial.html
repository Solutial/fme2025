<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Inteligente para Mineração</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
            background-color: #f9f9f9;
        }
        h1 {
            font-size: 22px;
            font-weight: bold;
        }
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
        }
        button:disabled {
            background-color: #ddd;
            cursor: not-allowed;
        }
        .record {
            background-color: #007BFF;
            color: white;
        }
        .stop {
            background-color: #dc3545;
            color: white;
        }
        .submit {
            background-color: #28a745;
            color: white;
        }
        audio {
            margin-top: 20px;
            width: 90%;
            height: 50px;
        }
        textarea {
            width: 85%;
            height: 120px;
            margin-top: 20px;
            font-size: 18px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Assistente Inteligente para Mineração</h1>
    <p>Faça uma pergunta sobre este ativo usando sua voz.</p>
    <button id="startRecording" class="record">🎤 Gravar</button>
    <button id="stopRecording" class="stop" disabled>⏹️ Parar</button>
    <audio id="audioPlayback" controls></audio>
    <textarea id="transcription" placeholder="A transcrição aparecerá aqui..." readonly></textarea>

    <!-- Submission Form -->
    <form id="submissionForm" action="http://DANILO/fmedatastreaming/IA/WOrkspace_GoogleGemini01.fmw" method="get">
        <input type="hidden" name="GISID" id="featureId" value="">
        <input type="hidden" name="FEATURETYPE" id="featureType" value="">
        <input type="hidden" name="TEXTFROMAUDIO" id="audioText" value="">
        <input type="hidden" name="AIAGENT" id="aiAgent" value="">
        <input type="hidden" name="token" id="authToken" value="1878433a045b8b042ff753b73303bba5b032c546">
        <button type="submit" id="submitButton" class="submit" disabled>Enviar</button>
    </form>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        const maxRecordingTime = 10000; // 10 seconds

        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById("featureId").value = urlParams.get('GISID') || "";
        document.getElementById("featureType").value = urlParams.get('FEATURETYPE') || "";
        document.getElementById("aiAgent").value = urlParams.get('AIAGENT') || "";

        const startBtn = document.getElementById("startRecording");
        const stopBtn = document.getElementById("stopRecording");
        const audioPlayback = document.getElementById("audioPlayback");
        const transcriptionArea = document.getElementById("transcription");
        const submitBtn = document.getElementById("submitButton");

        startBtn.addEventListener("click", async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: "audio/wav" });
                const audioURL = URL.createObjectURL(audioBlob);
                audioPlayback.src = audioURL;

                // Enable the submit button
                submitBtn.disabled = false;

                // Send audioBlob to OpenAI API for transcription
                const transcription = await sendToOpenAI(audioBlob);
                transcriptionArea.value = transcription || "Transcription failed.";
                document.getElementById("audioText").value = transcription;
            };

            // Start recording and emit chunks every second
            mediaRecorder.start(1000);

            audioChunks = [];
            startBtn.disabled = true;
            stopBtn.disabled = false;

            // Automatically stop recording after maxRecordingTime
            setTimeout(() => {
                if (mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                }
            }, maxRecordingTime);
        });

        stopBtn.addEventListener("click", () => {
            if (mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        });

        async function sendToOpenAI(audioBlob) {
            const apiKey = "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"; // Replace with your OpenAI API key
            const formData = new FormData();
            formData.append("file", audioBlob, "recording.wav");
            formData.append("model", "whisper-1");

            try {
                const response = await fetch("https://api.openai.com/v1/audio/transcriptions", {
                    method: "POST",
                    headers: {
                        Authorization: `Bearer ${apiKey}`
                    },
                    body: formData
                });

                const data = await response.json();
                return data.text;
            } catch (error) {
                console.error("Error transcribing audio:", error);
                return null;
            }
        }
    </script>
</body>
</html>
