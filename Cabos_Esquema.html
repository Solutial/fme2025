<!DOCTYPE html>
<html>
   <head>
      <title>Report</title>
      <meta charset="UTF-8">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" rel="stylesheet">
   </head>
   <body>
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cabo Elétrico – 5 Camadas | Solutial</title>
  <style>
    :root{--bg:#f7f7f8;--fg:#0f172a;--muted:#64748b;--line:#e5e7eb;--brand:#0ea5e9;--accent:#22c55e}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
    .brand{height:32px;object-fit:contain}
    .btn{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:10px;cursor:pointer}
    .btn:hover{background:#f3f4f6}

    .wrap{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:320px 1fr;gap:16px}
    @media (max-width:980px){.wrap{grid-template-columns:1fr}}

    .panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .panel .head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
    .panel .body{padding:12px 14px}
    .muted{color:var(--muted)}

    .list{display:flex;flex-direction:column;gap:8px}
    .item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px}
    .item input{margin-top:2px}
    .badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:#0f172a;background:#f8fafc}

    /* Área de desenho */
    .stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:480px}
    svg{display:block;width:100%;height:auto}

    /* Pinos/etiquetas */
    .pin{position:absolute;translate:-50% -50%;display:flex;align-items:center;gap:6px;cursor:pointer}
    .pin .dot{width:12px;height:12px;border:2px solid #fff;border-radius:999px;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
    .pin[data-active="true"] .dot{background:var(--accent)}
    .pin[data-active="false"] .dot{background:#94a3b8}
    .pin .label{background:#0f1115;color:#fff;font-size:12px;padding:4px 8px;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.25)}

    .legend{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
    .legend .pill{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer}

    @media print{header,.panel{display:none} .stage{border:0}}
  </style>
</head>
<body>
  <header>
    <img class="brand" src="https://solutial.github.io/fme2025/Logo3%20-%20Solutial.png" alt="Solutial"/>
    <button class="btn" onclick="window.print()">Imprimir</button>
  </header>

  <div class="wrap">
    <!-- Painel de camadas -->
    <aside class="panel">
      <div class="head"><strong>Camadas do Cabo (5)</strong><span class="badge">toggle para mostrar/ocultar</span></div>
      <div class="body">
        <div class="list" id="list"></div>
        <p class="muted" style="margin-top:10px">Dica: clique no marcador no desenho para destacar a camada.</p>
      </div>
    </aside>

    <!-- Desenho do cabo (SVG) -->
    <section class="panel">
      <div class="head"><strong>Cabo – Seção transversal esquemática</strong><span class="muted">exemplo 0,6/1 kV</span></div>
      <div class="stage" id="stage">
        <svg viewBox="0 0 900 600" aria-label="Esquema de cabo">
          <defs>
            <!-- Hachuras para blindagem/armadura -->
            <pattern id="diag" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
              <line x1="0" y1="0" x2="0" y2="8" stroke="#64748b" stroke-width="2"/>
            </pattern>
            <pattern id="armor" patternUnits="userSpaceOnUse" width="10" height="10">
              <rect x="0" y="0" width="10" height="10" fill="#9ca3af"/>
              <line x1="0" y1="10" x2="10" y2="0" stroke="#6b7280" stroke-width="2"/>
            </pattern>
          </defs>

          <!-- Fundo gradiente leve -->
          <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#eef2ff"/>
            <stop offset="100%" stop-color="#ffffff"/>
          </linearGradient>
          <rect x="0" y="0" width="900" height="600" fill="url(#sky)"/>

          <!-- Seção do cabo (círculos concêntricos) -->
          <g id="cabo" transform="translate(300,100)">
            <!-- 1) Condutor (feixes de fios de cobre) -->
            <g id="condutor">
              <circle cx="150" cy="200" r="70" fill="#b45309" stroke="#92400e" stroke-width="3"/>
              <!-- simulação de fios -->
              <g fill="#d97706" stroke="#92400e" stroke-width="1">
                <circle cx="150" cy="200" r="22"/>
                <circle cx="150" cy="160" r="14"/>
                <circle cx="150" cy="240" r="14"/>
                <circle cx="110" cy="200" r="14"/>
                <circle cx="190" cy="200" r="14"/>
                <circle cx="120" cy="170" r="10"/>
                <circle cx="180" cy="170" r="10"/>
                <circle cx="120" cy="230" r="10"/>
                <circle cx="180" cy="230" r="10"/>
              </g>
            </g>

            <!-- 2) Isolação (XLPE/PVC) -->
            <g id="isolacao">
              <circle cx="150" cy="200" r="110" fill="#60a5fa" opacity="0.9" stroke="#3b82f6" stroke-width="4"/>
            </g>

            <!-- 3) Blindagem (fita/trança) + dreno -->
            <g id="blindagem">
              <circle cx="150" cy="200" r="130" fill="url(#diag)" stroke="#475569" stroke-width="3"/>
              <!-- Dreno -->
              <circle cx="260" cy="200" r="6" fill="#0f172a"/>
            </g>

            <!-- 4) Armadura (fita de aço) -->
            <g id="armadura">
              <circle cx="150" cy="200" r="155" fill="url(#armor)" stroke="#475569" stroke-width="3"/>
            </g>

            <!-- 5) Capa externa (PE/LSZH) -->
            <g id="capa">
              <circle cx="150" cy="200" r="185" fill="#111827" stroke="#111827" stroke-width="6"/>
            </g>
          </g>

          <!-- Vista lateral curta para contexto -->
          <g id="lateral">
            <rect x="560" y="240" width="260" height="40" rx="20" fill="#111827"/>
            <rect x="570" y="250" width="240" height="20" rx="10" fill="#9ca3af"/>
          </g>
        </svg>

        <!-- Pinos (posições relativas ao .stage) -->
        <div class="pin" data-id="condutor" style="left:39.5%; top:46%">
          <span class="dot"></span><span class="label">Condutor (Cu/Al)</span>
        </div>
        <div class="pin" data-id="isolacao" style="left:44.5%; top:31%">
          <span class="dot"></span><span class="label">Isolação (PVC/XLPE)</span>
        </div>
        <div class="pin" data-id="blindagem" style="left:55%; top:58%">
          <span class="dot"></span><span class="label">Blindagem + dreno</span>
        </div>
        <div class="pin" data-id="armadura" style="left:55%; top:36%">
          <span class="dot"></span><span class="label">Armadura (aço)</span>
        </div>
        <div class="pin" data-id="capa" style="left:42%; top:66%">
          <span class="dot"></span><span class="label">Capa externa (PE/LSZH)</span>
        </div>
      </div>
      <div class="legend" id="legend"></div>
    </section>
  </div>

  <script>
    // Definição das 5 camadas
    const CAMADAS = [
      { id:'condutor', nome:'Condutor (Cu/Al)', desc:'Feixes de fios – cobre ou alumínio. Define resistência e queda de tensão.' },
      { id:'isolacao', nome:'Isolação (PVC/XLPE)', desc:'Separação elétrica do condutor. Classe térmica (70/90 °C) impacta ampacidade.' },
      { id:'blindagem', nome:'Blindagem + dreno', desc:'Proteção contra EMI (fita/trança). Fio dreno para aterramento da malha.' },
      { id:'armadura', nome:'Armadura (aço)', desc:'Proteção mecânica para instalação enterrada/industrial.' },
      { id:'capa', nome:'Capa externa (PE/LSZH)', desc:'Proteção ambiental/UV/óleos; LSZH quando exigido por segurança.' }
    ];

    const stage = document.getElementById('stage');
    const list = document.getElementById('list');
    const legend = document.getElementById('legend');

    // Monta lista e legenda
    CAMADAS.forEach(c => {
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `
        <input type="checkbox" id="chk-${c.id}" checked aria-label="Mostrar ${c.nome}"/>
        <div>
          <label for="chk-${c.id}"><strong>${c.nome}</strong></label>
          <div class="muted">${c.desc}</div>
        </div>`;
      list.appendChild(row);

      const pill = document.createElement('span');
      pill.className = 'pill';
      pill.textContent = c.nome;
      pill.addEventListener('click', () => highlight(c.id));
      legend.appendChild(pill);
    });

    // Estado inicial: todos ativos
    document.querySelectorAll('.pin').forEach(pin=> pin.dataset.active = 'true');

    // Toggle de visibilidade
    CAMADAS.forEach(c => {
      const chk = document.getElementById(`chk-${c.id}`);
      chk.addEventListener('change', () => setVisible(c.id, chk.checked));
    });

    function setVisible(id, on){
      const g = stage.querySelector('svg #' + id);
      if(g) g.style.display = on ? '' : 'none';
      const pin = stage.querySelector(`.pin[data-id="${id}"]`);
      if(pin) pin.dataset.active = on ? 'true' : 'false';
    }

    function highlight(id){
      const g = stage.querySelector('svg #' + id);
      const pin = stage.querySelector(`.pin[data-id="${id}"] .label`);
      if(!g || !pin) return;
      const old = g.style.filter;
      g.style.filter = 'drop-shadow(0 0 8px rgba(34,197,94,.85))';
      pin.style.outline = '2px solid var(--accent)';
      setTimeout(()=>{ g.style.filter = old || ''; pin.style.outline = 'none'; }, 900);
      const chk = document.getElementById('chk-' + id);
      if(chk && !chk.checked){ chk.checked = true; setVisible(id, true); }
    }

    // Clique direto nos pinos
    stage.querySelectorAll('.pin').forEach(pin => {
      pin.addEventListener('click', () => highlight(pin.dataset.id));
    });
  </script>
</body>
</html>

   </body>
</html>
