<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Tabela em formato de lista</title>
<style>
  body {
    font-family: Arial, sans-serif;
  }
  .logo {
    text-align: center;
    margin-bottom: 20px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
  }
  td {
    border: 1px solid #ccc;
    padding: 8px;
  }
  td.label {
    font-weight: bold;
    background-color: #f2f2f2;
    width: 30%;
  }
</style>
</head>
<body>

<!-- Logo -->
<div class="logo">
  <img src="https://solutial.github.io/fme2025/Logo3%20-%20Solutial.png" alt="Logo Solutial" width="200">
</div>

<!-- Tabela linha por linha -->
<h2>Informações do Alerta</h2>
<table>
  <tr>
    <td class="label">Derramamento Químico</td>
    <td>#DQ-038</td>
  </tr>
  <tr>
    <td class="label">Produto</td>
    <td>Óleo</td>
  </tr>
  <tr>
    <td class="label">Volume Derramado</td>
    <td>5 L</td>
  </tr>
    <tr>
    <td class="label">Data/Hora</td>
    <td>19-AGO-2026 09:42</td>
  </tr>
    <tr>
    <td class="label">Área Afetada</td>
    <td>10 m²</td>
  </tr>
    <tr>
    <td class="label">Equipe</td>
    <td>Ambiental 01</td>
  </tr>
    <tr>
    <td class="label">Via Interditada</td>
    <td>Não</td>
  </tr>
    <tr>
    <td class="label">Status</td>
    <td>Em Contenção</td>
  </tr>
      <td class="label">Severidade</td>
    <td>Alta</td>
  </tr>
</table>
<div class="logo">
  <img src="https://solutial.github.io/fme2025/quimico02.png" alt="quimico" width="500">
</div>
</body>
</html>
