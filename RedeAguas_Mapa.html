  <style>
    :root{--bg:#f7f7f8;--fg:#111;--muted:#6b7280;--brand:#0ea5e9;--header-h:56px;--panel-h:96px}
    body{margin:0;font:15px/1.45 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg)}
    header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e7eb;background:#fff;position:sticky;top:0;z-index:10;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));}
    h1{font-size:16px;margin:0}
    #map{height:calc(100dvh - var(--header-h) - var(--panel-h));width:100%;max-width:100vw}
    .panel{padding:12px 16px}
    .muted{color:var(--muted)}
    .badge{display:inline-block;padding:2px 8px;border:1px solid #e5e7eb;border-radius:999px;font-size:12px}
    .btn{border:1px solid #e5e7eb;padding:8px 12px;border-radius:10px;background:#fff;cursor:pointer}
    .btn:hover{background:#f3f4f6}
    @media print{header,.panel{display:none} #map{height:100vh}}
    .brand{display:block;height:40px;max-height:40px;width:auto;max-width:100%;object-fit:contain}
  @media (max-width:640px){.panel{padding:10px 12px}.btn{padding:10px 12px}}
  @media (max-width:640px){.brand{height:32px;max-height:32px}}
  </style>

  <div id="map" role="region" aria-label="Mapa"></div>
  <div class="panel">
    <div class="muted">Fonte do mapa: © OpenStreetMap contributors</div>
    <div class="muted" id="info"></div>
    <div class="badge" id="lockState">Interação: bloqueada</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">  // Ajuste responsivo de alturas (mobile/tablet)
    const root = document.documentElement;
    const headerEl = document.querySelector('header');
    const panelEl = document.querySelector('.panel');
    function refreshLayout(){
      root.style.setProperty('--header-h', headerEl.offsetHeight + 'px');
      root.style.setProperty('--panel-h', panelEl.offsetHeight + 'px');
      map.invalidateSize(true);
    }
    window.addEventListener('load', refreshLayout);
    window.addEventListener('resize', refreshLayout);
    window.addEventListener('orientationchange', refreshLayout);
  </script>
  <script>
    // ======================== CONFIGURAÇÃO RÁPIDA =========================
    // Opção A) Defina manualmente aqui (lat/lon e zoom) – "localidade fixa" 
    const CONFIG = {
      lat: -23.1918802,   // <<< troque depois que você me passar a localidade
      lon: -45.8885647,   // <<< troque depois que você me passar a localidade
      zoom: 15,
      titulo: 'Modelo FMEAR Aqui!',
      fixa: false // true = sem arrastar/zoom; false = interativo
    };

    // Opção B) (alternativa) Via parâmetros de URL: ?lat=-23.2&lon=-45.9&zoom=15&titulo=Meu+Ponto&fixa=1
    const qs = new URLSearchParams(location.search);
    if(qs.has('lat') && qs.has('lon')){
      CONFIG.lat = parseFloat(qs.get('lat'));
      CONFIG.lon = parseFloat(qs.get('lon'));
    }
    if(qs.has('zoom')) CONFIG.zoom = parseInt(qs.get('zoom'),10);
    if(qs.has('titulo')) CONFIG.titulo = qs.get('titulo');
    if(qs.has('fixa')) CONFIG.fixa = qs.get('fixa')==='1' || qs.get('fixa')==='true';

    // Inicializa mapa Leaflet com tiles do OpenStreetMap (com atribuição obrigatória)
    const map = L.map('map', {
      center: [CONFIG.lat, CONFIG.lon],
      zoom: CONFIG.zoom,
      zoomControl: !CONFIG.fixa,
      dragging: !CONFIG.fixa,
      scrollWheelZoom: !CONFIG.fixa,
      doubleClickZoom: !CONFIG.fixa,
      boxZoom: !CONFIG.fixa,
      keyboard: !CONFIG.fixa,
      tap: !CONFIG.fixa,
      touchZoom: !CONFIG.fixa
    });

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    });

    const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles © Esri — Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    });

    // Base padrão: OSM
    osm.addTo(map);

    // Controle de camadas para alternar entre OSM e Satélite
    L.control.layers({ 'OSM Padrão': osm, 'Satélite (Esri World Imagery)': esriSat }).addTo(map);

    // Escala métrica
    L.control.scale({ metric: true, imperial: false }).addTo(map);

    // Marcador fixo
    const marker = L.marker([CONFIG.lat, CONFIG.lon]).addTo(map);
    marker.bindPopup(`<b>${CONFIG.titulo}</b><br>Lat: ${CONFIG.lat.toFixed(5)} | Lon: ${CONFIG.lon.toFixed(5)}`).openPopup();

    // Info
    const info = document.getElementById('info');
    info.textContent = `Centro: ${CONFIG.lat.toFixed(5)}, ${CONFIG.lon.toFixed(5)} | Zoom: ${CONFIG.zoom} | Título: ${CONFIG.titulo}`;
    document.getElementById('lockState').textContent = `Interação: ${CONFIG.fixa ? 'bloqueada' : 'livre'}`;

    // Botão de impressão/PDF (use Ctrl+P para exportar em PDF)
    document.getElementById('print').addEventListener('click', ()=> window.print());

    // ================== (Opcional) GEOcodificação por endereço ==================
    // Se preferir passar um endereço em vez de lat/lon, descomente a função abaixo
